<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hardy-Weinberg Equilibrium Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Hardy-Weinberg Equilibrium Test</h1>
      <p class="subtitle">Santos, Lemes &amp; Otto (2020) &mdash; DOI: 10.1590/1678-4685-GMB-2019-0380</p>
    </header>

    <main>
      <!-- Input section -->
      <section id="input-section">
        <div class="input-row">
          <div id="allele-selector" class="card">
            <h2>Alleles</h2>
            <div class="form-group">
              <label for="n-alleles">Number of alleles:</label>
              <input type="number" id="n-alleles" min="2" max="12" value="2" />
            </div>
          </div>

          <div id="test-selector" class="card">
            <h2>Statistical Tests</h2>
          </div>

          <div id="data-entry" class="card">
            <h2>Genotype Data</h2>
          </div>
        </div>

        <div class="run-bar">
          <button id="btn-run" class="btn-primary">Run Tests</button>
          <span id="status-msg"></span>
        </div>
      </section>

      <!-- Results section -->
      <section id="results-section" class="hidden">
        <div class="results-row">
          <div id="results-table" class="card"></div>
          <div id="ternary-plot" class="card"></div>
        </div>
      </section>
    </main>

    <footer>
      <p>Copyright 2006-2019 Fernando A. Bautzer Santos, Renan B. Lemes &amp; Paulo A. Otto</p>
      <p>Departamento de Genetica e Biologia Evolutiva, Universidade de Sao Paulo</p>
    </footer>
  </div>

  <script type="module" src="app.ts"></script>
</body>
</html>
